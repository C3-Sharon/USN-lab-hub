spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}   # 默认激活 dev，部署时可通过参数覆盖
  jackson:
    time-zone: Asia/Shanghai
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
  data:
    redis:
      port: 6379
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml
# 自定义 JWT 配置
usnhub:
  jwt:
    # 密钥：必须足够长
    secret-key: UsnLabHub_SecretKey_Professional_Version_2026_Secure!
    # 过期时间：43200000 毫秒 (12小时)
    ttl: 43200000
    # 前端请求头中的名字
    token-name: Authorization
  iot:
    operations:
      timeout-enabled: ${IOT_COMMAND_TIMEOUT_ENABLED:true}
      timeout-check-delay-ms: ${IOT_COMMAND_TIMEOUT_CHECK_DELAY_MS:1000}
    mqtt:
      enabled: ${IOT_MQTT_ENABLED:true}
      broker-url: ${IOT_MQTT_BROKER_URL:tcp://127.0.0.1:1883}
      client-id: ${IOT_MQTT_CLIENT_ID:usn-lab-hub-backend}
      telemetry-topic: ${IOT_MQTT_TELEMETRY_TOPIC:iot/power-monitor/PM-001/telemetry}
      command-topic: ${IOT_MQTT_COMMAND_TOPIC:iot/power-monitor/PM-001/command}
      ack-topic: ${IOT_MQTT_ACK_TOPIC:iot/power-monitor/PM-001/ack}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs


server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: false
